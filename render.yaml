services:
  - type: web
    name: agentflow-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r apps/api/requirements.txt -r mcp-server/requirements.txt"
    startCommand: "python apps/api/main.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: PYTHONPATH
        value: apps/api:.
      - key: PORT
        value: 8000
      - key: MONGO_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: ADMIN_API_KEY
        value: agentflow-secret-key

name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-test:
    name: Backend & MCP Test Suite
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            apps/api/requirements.txt
            mcp-server/requirements.txt

      - name: Install Backend & MCP Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r mcp-server/requirements.txt

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .:apps/api:mcp-server
          MONGODB_URI: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379
        run: python -m pytest apps/api/tests mcp-server/tests -v

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix apps/web || npm install --prefix apps/web

      - name: Build Frontend Next.js App
        run: npm run build --prefix apps/web

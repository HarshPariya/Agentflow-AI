<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="af-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container with Enterprise Gradient -->
  <rect width="32" height="32" rx="9" fill="url(#af-bg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="8.5" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />

  <!-- Autonomous Agent Flow Network (Matched 1:1 with In-App Logo) -->
  <g transform="translate(4, 4)">
    <!-- Connecting Data Pathways -->
    <path d="M12 8v4" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M7.5 17.5l3-3" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M16.5 17.5l-3-3" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Outer Nodes: Planner, Retriever, Tool-Executor -->
    <circle cx="12" cy="5" r="3" stroke="#ffffff" stroke-width="2.2" fill="#1e40af" />
    <circle cx="5" cy="19" r="3" stroke="#ffffff" stroke-width="2.2" fill="#1e40af" />
    <circle cx="19" cy="19" r="3" stroke="#ffffff" stroke-width="2.2" fill="#1e40af" />

    <!-- Center Orchestrator Node -->
    <circle cx="12" cy="13" r="2" fill="#ffffff" />
  </g>
</svg>
